<!doctype html>
<html lang="en" translate="no" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="google" content="notranslate">
<title>KETI Traffic Generator</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <img class="logo logo-light" src="/keti.png" alt="KETI">
    <img class="logo logo-dark" src="/keti-white.png" alt="KETI">
    <div class="title">Traffic Gen</div>
    <div class="topstat">
      <span class="pill" id="iface-pill">eth0</span>
      <span class="pill" id="link-pill">—</span>
      <span class="clock" id="elapsed">00:00</span>
      <button class="theme-btn" id="btn-theme" title="Light / dark">◐</button>
    </div>
  </header>

  <main class="grid">
    <!-- live gauges -->
    <section class="gauges">
      <div class="card gauge">
        <div class="gauge-label">THROUGHPUT</div>
        <div class="gauge-value"><span id="mbps">0.0</span><small>Mbps</small></div>
        <div class="bar"><div class="bar-fill" id="mbps-bar"></div></div>
        <div class="gauge-sub"><span id="mbps-pct">0%</span> of line rate</div>
      </div>
      <div class="card gauge">
        <div class="gauge-label">PACKET RATE</div>
        <div class="gauge-value"><span id="pps">0</span><small>pps</small></div>
        <div class="bar"><div class="bar-fill alt" id="pps-bar"></div></div>
        <div class="gauge-sub"><span id="kpps">0.0</span> kpps</div>
      </div>
      <div class="card gauge">
        <div class="gauge-label">SENT</div>
        <div class="gauge-value"><span id="sent">0</span><small>pkts</small></div>
        <div class="gauge-sub"><span id="errdrop">0 err / 0 drop</span></div>
      </div>
    </section>

    <!-- protected video flow -->
    <section class="card video-card" id="video-card" hidden>
      <div class="section-head">
        <span>PROTECTED VIDEO</span>
        <span class="video-note" id="video-note"></span>
      </div>
      <video id="video" muted loop autoplay playsinline></video>
    </section>

    <!-- live chart -->
    <section class="card chart-card">
      <div class="chart-legend">
        <span class="lg"><i class="dot blue"></i>Throughput</span>
        <span class="lg"><i class="dot orange"></i>Packet rate</span>
      </div>
      <canvas id="chart"></canvas>
    </section>

    <!-- start / stop -->
    <section class="actions">
      <button class="tesla stop" id="btn-stop">
        <span class="glyph">■</span><span class="lbl">STOP</span>
      </button>
      <button class="tesla tsn" id="btn-tsn">
        <span class="glyph">⚡</span><span class="lbl">TSN ON</span>
      </button>
      <button class="tesla start" id="btn-start">
        <span class="glyph">▶</span><span class="lbl">START</span>
      </button>
    </section>
    <div class="msg" id="msg"></div>

    <!-- presets -->
    <section class="card presets-card">
      <div class="section-head">
        <span>PRESETS</span>
        <button class="text-btn" id="btn-save">＋ Save current</button>
      </div>
      <div class="presets" id="presets"></div>
      <div class="presets user" id="user-presets"></div>
    </section>

    <!-- stream editor -->
    <section class="card streams">
      <div class="section-head">
        <span>STREAMS</span>
        <div class="head-controls">
          <select id="iface-select" class="mini"></select>
          <button class="text-btn" id="btn-add">＋ stream</button>
        </div>
      </div>
      <div class="plan" id="plan"></div>
      <div id="stream-list"></div>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
