# YANG paths the switch-controller firmware needs, resolved to SIDs at build time.
#
# Keep this list small and deliberate. The point of a generated table is that the firmware
# never carries the 1.6 MB YANG catalog nor parses JSON on the device -- it carries only the
# handful of SIDs it actually asks for.
#
# Adding a path here and re-running the generator is the whole workflow.

# The dashboard's source of truth: every port, its link state, and its counters. Reading the
# subtree rather than named ports is deliberate -- the LAN9692 has many more ports than the
# 9662 on the bench, and the port list must be discovered, never assumed.
- "/ietf-interfaces:interfaces"

# Device identity, for the console header.
- "/ietf-system:system-state/platform"

# Named nodes under the subtree above. Not needed to read it, but having the SIDs lets the
# firmware decode a response without carrying the catalog to look names up.
- "/ietf-interfaces:interfaces/interface"
- "/ietf-interfaces:interfaces/interface/name"
- "/ietf-interfaces:interfaces/interface/oper-status"
- "/ietf-interfaces:interfaces/interface/statistics"

# Counter leaves the dashboard graphs. Named individually because the firmware decodes the
# response by SID: it matches these numbers against the delta-encoded keys on the wire, and
# anything it has no SID for it simply skips.
- "/ietf-interfaces:interfaces/interface/phys-address"
- "/ietf-interfaces:interfaces/interface/statistics/in-octets"
- "/ietf-interfaces:interfaces/interface/statistics/out-octets"
- "/ietf-interfaces:interfaces/interface/statistics/in-errors"
- "/ietf-interfaces:interfaces/interface/statistics/out-errors"
- "/ietf-interfaces:interfaces/interface/statistics/in-discards"
- "/ietf-interfaces:interfaces/interface/statistics/out-discards"
- "/ietf-interfaces:interfaces/interface/statistics/in-unicast-pkts"
- "/ietf-interfaces:interfaces/interface/statistics/out-unicast-pkts"

# What the device calls itself. Read rather than hardcoded: the bench part answers
# "LAN9662 - ung8291" and the target will answer LAN9692, and a label written into the app
# would be wrong on one of them without anyone noticing.
- "/ietf-system:system-state/platform/machine"
- "/ietf-system:system-state/platform/os-version"

# Writable: the first configuration this console changes. A boolean is the simplest possible
# value to encode, and its effect shows up in the port list we already display.
- "/ietf-interfaces:interfaces/interface/enabled"

# TAS gate parameters, read per port on demand rather than in the periodic snapshot: the
# interface subtree is already 6.5 KB for thirteen ports and a gate table each would swamp it.
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/gate-enabled"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/oper-gate-states"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-cycle-time/numerator"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-cycle-time/denominator"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-control-list/gate-control-entry"

# The schedule itself. This is the picture worth drawing: which traffic classes are open when,
# across one cycle. RECON swaps these on link failure, so the timeline changing is the demo.
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-control-list/gate-control-entry/index"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-control-list/gate-control-entry/time-interval-value"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-control-list/gate-control-entry/gate-states-value"

# Needed to write a schedule. operation-name carries an identity SID as its value
# (set-gate-states), and config-change is the trigger that makes the switch adopt the
# admin list.
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/admin-control-list/gate-control-entry/operation-name"
- "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/ieee802-dot1q-sched-bridge:gate-parameter-table/config-change"

# Already inside the interface subtree, so reading these costs nothing extra. Error frames are
# what a network demo needs to show when something is actually wrong, rather than only when a
# link is down.
- "/ietf-interfaces:interfaces/interface/ieee802-ethernet-interface:ethernet/speed"
- "/ietf-interfaces:interfaces/interface/ieee802-ethernet-interface:ethernet/statistics/frame/in-error-fcs-frames"
- "/ietf-interfaces:interfaces/interface/ieee802-ethernet-interface:ethernet/statistics/frame/in-error-oversize-frames"
- "/ietf-interfaces:interfaces/interface/ieee802-ethernet-interface:ethernet/statistics/frame/in-error-undersize-frames"

# The RPC that writes running config to flash. Addressed like any other node: {sid: null}.
- "/mchp-velocitysp-system:save-config"

# PTP and LLDP: not implemented on the current switch build (empty lists, null containers), so
# nothing reads these yet. They are resolved now because a SID is a fact from the catalog, not
# a guess about the wire -- baking them costs nothing and removes a step later. The parsing is
# deliberately still absent: that part has to be written against bytes the device actually
# sends, which is where every wrong guess in this project came from.
- "/ieee1588-ptp:ptp/instances/instance/default-ds/clock-identity"
- "/ieee1588-ptp:ptp/instances/instance/default-ds/instance-enable"
- "/ieee1588-ptp:ptp/instances/instance/current-ds/offset-from-master"
- "/ieee1588-ptp:ptp/instances/instance/parent-ds/parent-port-identity/clock-identity"
- "/ieee802-dot1ab-lldp:lldp/port/admin-status"
- "/ieee802-dot1ab-lldp:lldp/port/remote-systems-data/chassis-id"
- "/ieee802-dot1ab-lldp:lldp/port/remote-systems-data/port-id"
- "/ieee802-dot1ab-lldp:lldp/port/remote-systems-data/system-name"
